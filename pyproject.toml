[project]
name = "fmcg-reco"
version = "0.1.0"
description = "End-to-end FMCG recommender and targeting system on Dunnhumby retail data"
readme = "README.md"
requires-python = ">=3.11"

# Phase 0 — data audit, EDA, notebooks
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "jupyterlab>=4.2",
    "kaggle>=1.6",
]

[dependency-groups]
# Added as we reach each phase:  uv sync --group models   etc.
models = [
    "scikit-learn>=1.5",
    "implicit>=0.7",      # ALS / BPR collaborative filtering
    "mlxtend>=0.23",      # FP-Growth / association rules
    "lightgbm>=4.3",      # learning-to-rank hybrid reranker
    "scikit-uplift>=0.5", # uplift models + Qini / AUUC
    "lifetimes>=0.11",    # CLV (BG/NBD + Gamma-Gamma)
]
serving = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
    "mlflow>=2.14",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.21",
    "pyjwt>=2.9",
    "pwdlib[bcrypt]>=0.2",
    "python-multipart>=0.0.9",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pandera>=0.20",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["models", "serving", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmcg_reco"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
